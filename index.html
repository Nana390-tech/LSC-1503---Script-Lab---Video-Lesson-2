<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Lab – LSC 1503 Video Portfolio</title>
<style>
:root{
  --green:#1F5F4A; --green2:#2E7D62; --green-l:#E3F1EA;
  --tan:#F28C28; --tan2:#D9741A; --tan-l:#FFF0E0;
  --cream:#FFF8EE; --ink:#1E2B26; --muted:#5E6E67; --line:#E6DCCB;
  --ok:#2E9E5B; --bad:#D64545;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:22px 16px 18px;text-align:center;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--tan);opacity:.25}
header h1{font-size:1.9rem;letter-spacing:.5px}
header p{opacity:.9}
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:12px}
.pill{background:rgba(255,255,255,.18);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.9rem}
.pill b{color:#FFD9B0}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px 10px;background:#fff;border-bottom:3px solid var(--tan);position:sticky;top:0;z-index:5}
nav button{border:2px solid var(--green);background:#fff;color:var(--green);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:.9rem}
nav button.active{background:var(--green);color:#fff}
nav button.done:after{content:" ✓";color:var(--tan)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 14px rgba(31,95,74,.08);border:1px solid var(--line)}
.phase-tag{display:inline-block;background:var(--tan);color:#fff;font-weight:800;font-size:.75rem;letter-spacing:1px;padding:4px 10px;border-radius:6px;margin-bottom:8px}
h2{color:var(--green);margin-bottom:6px;font-size:1.45rem}
h3{color:var(--green);margin:10px 0 6px}
p.lead{color:var(--muted);margin-bottom:12px}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:.95rem;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-green{background:var(--green);color:#fff}
.btn-tan{background:var(--tan);color:#fff}
.btn-ghost{background:#fff;color:var(--green);border:2px solid var(--green)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.choice{border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;background:#fff;transition:.2s}
.choice:hover{border-color:var(--tan)}
.choice.right{border-color:var(--ok);background:#EAF7EF}
.choice.wrong{border-color:var(--bad);background:#FCECEC}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:600;display:none}
.fb.show{display:block}
.fb.good{background:#EAF7EF;color:#1E6B3E}
.fb.bad{background:#FCECEC;color:#8A2525}
.sort-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.sort-item span{flex:1;min-width:220px}
.sort-item.right{background:#EAF7EF;border-color:var(--ok)}
.sort-item.wrong{background:#FCECEC;border-color:var(--bad)}
.mini{padding:6px 10px;border-radius:8px;font-size:.85rem}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;font-family:inherit}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--tan)}
textarea{min-height:120px;resize:vertical}
.section-box{border-left:6px solid var(--green);background:#FBFDFC;border-radius:12px;padding:16px;margin-bottom:16px}
.frames{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.frame{background:var(--tan-l);border:1px dashed var(--tan);color:#8A4A0F;border-radius:8px;padding:5px 9px;font-size:.85rem;cursor:pointer}
.frame:hover{background:#FFE2C2}
.meter{height:12px;background:#EEE6D8;border-radius:999px;overflow:hidden;margin-top:6px}
.meter div{height:100%;background:var(--green);transition:width .3s}
.meter.low div{background:#E0A43A}.meter.high div{background:var(--bad)}
.stat{font-size:.88rem;color:var(--muted);margin-top:4px}
.total-box{background:var(--green);color:#fff;border-radius:14px;padding:16px;text-align:center}
.total-box .big{font-size:2rem;font-weight:800}
.cue{background:#fff;border:2px solid var(--tan);border-radius:14px;padding:14px;margin-bottom:12px}
.cue h4{color:var(--tan2);margin-bottom:6px}
.warn{color:var(--bad);font-weight:600;font-size:.88rem}
.okmsg{color:var(--ok);font-weight:600;font-size:.88rem}
.glance-stage{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.45rem;font-weight:600;padding:20px;border-radius:16px;background:var(--green-l);margin:12px 0}
.glance-stage.hidden-line{background:var(--green);color:#fff}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--green)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.flip{perspective:800px;height:110px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;backface-visibility:hidden}
.front{background:var(--green);color:#fff;font-weight:700}
.back{background:var(--tan-l);color:var(--ink);transform:rotateY(180deg);border:2px solid var(--tan);font-size:.85rem}
.back .ar{font-size:1.1rem;font-weight:700;color:var(--tan2);direction:rtl}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{border-radius:12px;padding:10px 14px;background:#F1EEE7;color:#9A9384;font-weight:700}
.badge.on{background:var(--tan);color:#fff}
.cert{border:8px double var(--green);border-radius:18px;padding:30px;text-align:center;background:linear-gradient(135deg,#fff,var(--tan-l))}
.cert h2{font-size:2rem}
.cert .name{font-size:1.8rem;font-weight:800;color:var(--tan2);margin:10px 0;border-bottom:2px solid var(--tan);display:inline-block;padding:0 20px}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.85rem}
.hidden{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:.3s}
.toast.show{opacity:1}
@media print{
  header,nav,footer,.no-print,.toast{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:none}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<header>
  <h1>✍️ Script Lab</h1>
  <p>LSC 1503 · Communication Skills Portfolio · Lesson 2: From ideas to script to cue cards</p>
  <div class="topbar">
    <span class="pill">Student: <b id="whoName">—</b></span>
    <span class="pill">Points: <b id="pts">0</b></span>
    <button class="btn btn-tan mini no-print" onclick="saveJSON()">💾 Save my work</button>
    <label class="btn btn-ghost mini no-print" style="background:#fff">📂 Open saved work<input type="file" accept=".json" class="hidden" onchange="loadJSON(event)"></label>
  </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>
<footer>Designed by: Nazila Motahari · LSC 1503 Professional Spoken Communication</footer>
<div class="toast" id="toast"></div>

<script>
/* ---------------- DATA ---------------- */
const PHASES=[
 {id:"start",name:"Start"},
 {id:"engage",name:"1. Engage"},
 {id:"explore",name:"2. Explore"},
 {id:"explain",name:"3. Explain: Write"},
 {id:"extend",name:"4. Extend: Cue Cards"},
 {id:"evaluate",name:"5. Evaluate"}
];

const ENGAGE=[
 {who:"Hamad",txt:"Hamad wrote every word. In the video he reads from the paper and never looks at the camera.",ok:false,fb:"Reading every word sounds flat and you lose eye contact."},
 {who:"Latifa",txt:"Latifa did not write anything. She speaks without notes, forgets her study skill and says “umm” many times.",ok:false,fb:"With no plan, you forget parts and hesitate."},
 {who:"Maitha",txt:"Maitha wrote a full script and practised it. In the video she glances at short notes, then looks up and speaks.",ok:true,fb:"Yes! Write it, practise it, then glance and look up."}
];

const SORT=[
 {t:"In this video, I'll tell you about my study skill.",a:"s"},
 {t:"This paper aims to examine the effectiveness of mind mapping.",a:"w"},
 {t:"So, why did I choose this LPA? Well, it was really useful.",a:"s"},
 {t:"Furthermore, it can be argued that time management is essential.",a:"w"},
 {t:"Let me give you an example.",a:"s"},
 {t:"The aforementioned strategy will be implemented subsequently.",a:"w"},
 {t:"Now, let's move on to my improvement plan.",a:"s"},
 {t:"It is evident from the data that students benefit from reflection.",a:"w"}
];

const SECTIONS=[
 {id:"intro",title:"Part 1 · Introduction + ID card",min:50,max:70,
  tip:"Say your name and ID, show your ID card, and give a one-sentence overview.",
  frames:["Hello, my name is ___ and my student ID is ___.","Here is my ID card.","In this video, I will talk about my LPA, one study skill and my improvement plan."]},
 {id:"lpa",title:"Part 2 · LPA reflection",min:110,max:150,
  tip:"Describe the LPA, say why you chose it, and say what you learned. (Show a screenshot.)",
  frames:["First, I'd like to talk about my LPA on ___.","In this activity, we ___.","I chose this LPA because ___.","From this activity, I learned that ___."]},
 {id:"skill",title:"Part 3 · Study skill reflection",min:90,max:130,
  tip:"Say what the skill is, why you chose it, give a real example, and say how it helped you.",
  frames:["Now, let's move on to my study skill.","The study skill I chose is ___. It means ___.","I chose it because ___.","For example, ___.","This skill helped me to ___."]},
 {id:"improve",title:"Part 4 · Improvement (What / So What / Now What)",min:110,max:150,
  tip:"WHAT is the problem? SO WHAT: why does it matter? NOW WHAT: what will you do?",
  frames:["Next, I'd like to talk about one thing I want to improve.","My problem is that ___.","This is important because ___.","To improve, I will ___.","I will check my progress by ___."]},
 {id:"concl",title:"Part 5 · Conclusion",min:30,max:50,
  tip:"Sum up the main ideas in one or two sentences and thank the viewer.",
  frames:["To sum up, ___.","In this course, I learned that ___.","Thank you for watching."]}
];
const WPM=110;

const GLOSS=[
 ["script","نص مكتوب","All the words you plan to say."],
 ["cue card","بطاقة تذكير","A small card with only key words."],
 ["key word","كلمة مفتاحية","An important word that reminds you of an idea."],
 ["glance","نظرة سريعة","A very quick look."],
 ["signposting","عبارات انتقالية","Phrases that show where you are going next."],
 ["spoken style","أسلوب المحادثة","Short, simple, friendly sentences."],
 ["word count","عدد الكلمات","How many words you have written."],
 ["draft","مسودة","An early version you will improve."],
 ["evidence","دليل","Proof of your own work (notes, drafts)."],
 ["own words","بأسلوبك الخاص","Words you wrote yourself, not copied or AI."]
];

const CHECKS=[
 "My script has all five parts in the correct order.",
 "I use signposting to move between parts.",
 "My sentences are short and sound spoken, not like an essay.",
 "My total time is between 3 and 5 minutes.",
 "I wrote the script in my own words (no AI full script).",
 "Each cue card has only key words (not full sentences).",
 "I practised the glance-and-look-up technique.",
 "I saved my script and cue cards as evidence."
];

/* ---------------- STATE ---------------- */
let S={name:"",phase:"start",points:0,done:{},engage:null,sort:{},script:{},cues:{},checks:{},reflect:""};
function el(id){return document.getElementById(id)}
function esc(t){return String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function words(t){return (t||"").trim().split(/\s+/).filter(Boolean).length}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function addPts(n,msg){S.points+=n;el("pts").textContent=S.points;if(msg)toast(msg)}
function toast(m){const t=el("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function markDone(id){if(!S.done[id]){S.done[id]=true;addPts(10,"🏅 Badge earned! +10");renderNav();confetti()}}

/* ---------------- NAV ---------------- */
function renderNav(){
  el("nav").innerHTML=PHASES.map(p=>`<button class="${S.phase===p.id?'active':''} ${S.done[p.id]?'done':''}" onclick="go('${p.id}')">${p.name}</button>`).join("");
  el("whoName").textContent=S.name||"—";
  el("pts").textContent=S.points;
}
function go(id){
  if(id!=="start"&&!S.name){toast("Please type your name first");id="start"}
  S.phase=id;renderNav();render();window.scrollTo({top:0,behavior:"smooth"})
}

/* ---------------- RENDER ---------------- */
function render(){
  const m=el("main");
  ({start:rStart,engage:rEngage,explore:rExplore,explain:rExplain,extend:rExtend,evaluate:rEvaluate})[S.phase](m);
}

function rStart(m){
  m.innerHTML=`
  <div class="card">
    <h2>Welcome to Script Lab 👋</h2>
    <p class="lead">Last lesson you planned your ideas. Today you turn them into a <b>script</b> and then into <b>cue cards</b> you can glance at while recording.</p>
    <h3>By the end of this lesson, you will…</h3>
    <ul style="margin-left:20px">
      <li>explain why we write a script but do not read it word for word</li>
      <li>write a 3–5 minute script for all five parts in a spoken style</li>
      <li>use signposting to move between parts</li>
      <li>turn your script into key-word cue cards</li>
      <li>practise the “glance and look up” technique</li>
    </ul>
    <h3 style="margin-top:16px">Your name</h3>
    <div class="row"><input type="text" id="nm" placeholder="Type your full name" value="${esc(S.name)}" style="max-width:380px">
    <button class="btn btn-green" onclick="setName()">Start ➜</button></div>
  </div>
  <div class="card">
    <h3>📖 Key words (tap to flip)</h3>
    <div class="gloss">${GLOSS.map(g=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="flip-in"><div class="face front">${g[0]}</div><div class="face back"><span class="ar">${g[1]}</span>${g[2]}</div></div></div>`).join("")}</div>
  </div>`;
}
function setName(){const v=el("nm").value.trim();if(!v){toast("Please type your name");return}S.name=v;renderNav();go("engage")}

function rEngage(m){
  m.innerHTML=`
  <div class="card"><span class="phase-tag">ENGAGE</span>
    <h2>Who will make the best video?</h2>
    <p class="lead">Three students are getting ready to record. Read about each one. Who has the best plan?</p>
    <div class="grid3">${ENGAGE.map((e,i)=>`<div class="choice ${S.engage!==null?(e.ok?'right':(S.engage===i?'wrong':'')):''}" onclick="pickEngage(${i})"><h3>${e.who}</h3><p>${e.txt}</p></div>`).join("")}</div>
    <div class="fb ${S.engage!==null?'show':''} ${S.engage!==null&&ENGAGE[S.engage].ok?'good':'bad'}" id="efb">${S.engage!==null?ENGAGE[S.engage].fb:''}</div>
    ${S.engage!==null?`<div class="card" style="margin-top:14px;background:var(--tan-l)"><b>Today's rule:</b> Write it ✍️ → Practise it 🗣️ → Glance and look up 👀<br><span style="color:var(--muted)">You may glance at your notes in the video, but most of the time you look at the camera.</span></div>
    <button class="btn btn-green" onclick="markDone('engage');go('explore')">Next: Explore ➜</button>`:''}
  </div>`;
}
function pickEngage(i){if(S.engage!==null)return;S.engage=i;if(ENGAGE[i].ok)addPts(10,"Correct! +10");render()}

function rExplore(m){
  const order=S._sortOrder||(S._sortOrder=shuffle(SORT.map((_,i)=>i)));
  const answered=Object.keys(S.sort).length;
  m.innerHTML=`
  <div class="card"><span class="phase-tag">EXPLORE</span>
    <h2>Spoken or written?</h2>
    <p class="lead">A video script must sound like <b>you speaking</b>, not like an essay. Decide for each sentence.</p>
    ${order.map(i=>{const s=SORT[i],a=S.sort[i];const cls=a?(a===s.a?'right':'wrong'):'';
      return `<div class="sort-item ${cls}"><span>${s.t}</span>${a?`<b>${a===s.a?'✓':'✗'} ${s.a==='s'?'🗣️ Spoken':'📄 Written'}</b>`:`<div class="row"><button class="btn btn-green mini" onclick="sortIt(${i},'s')">🗣️ Spoken</button><button class="btn btn-tan mini" onclick="sortIt(${i},'w')">📄 Written</button></div>`}</div>`}).join("")}
    ${answered===SORT.length?`<div class="card" style="background:var(--green-l);margin-top:12px">
      <b>What makes spoken style?</b>
      <ul style="margin-left:20px"><li>Short sentences (about 8–15 words)</li><li>Simple, everyday words</li><li>Talking to the viewer: “I”, “you”, “let me…”</li><li>Signposting: “First…”, “Now, let's move on to…”, “To sum up…”</li></ul></div>
      <button class="btn btn-green" onclick="markDone('explore');go('explain')">Next: Write my script ➜</button>`:''}
  </div>`;
}
function sortIt(i,a){if(S.sort[i])return;S.sort[i]=a;if(a===SORT[i].a)addPts(5,"+5");render()}

function rExplain(m){
  m.innerHTML=`
  <div class="card"><span class="phase-tag">EXPLAIN</span>
    <h2>Write your script</h2>
    <p class="lead">Write each part in your own words. Tap a yellow sentence starter to add it, then complete it. Aim for the word range: we speak about <b>${WPM} words per minute</b>.</p>
    <div class="fb show bad" style="margin-bottom:14px">🔴 Remember: AI must <b>not</b> write your script. Use your own words. You may use AI only to check grammar, then review every change.</div>
    ${SECTIONS.map(sec=>`
      <div class="section-box">
        <h3>${sec.title}</h3>
        <p style="color:var(--muted);font-size:.92rem">${sec.tip}</p>
        <div class="frames">${sec.frames.map(f=>`<span class="frame" onclick="addFrame('${sec.id}',this.textContent)">${esc(f)}</span>`).join("")}</div>
        <textarea id="ta_${sec.id}" oninput="updScript('${sec.id}')" placeholder="Write this part here...">${esc(S.script[sec.id]||"")}</textarea>
        <div class="meter" id="m_${sec.id}"><div></div></div>
        <div class="stat" id="st_${sec.id}"></div>
      </div>`).join("")}
    <div class="total-box"><div>Total</div><div class="big" id="totW">0 words</div><div id="totT">≈ 0:00</div><div id="totMsg" style="margin-top:6px"></div></div>
    <div class="row" style="margin-top:14px">
      <button class="btn btn-green" onclick="finishScript()">I've finished my script ➜</button>
      <button class="btn btn-ghost" onclick="window.print()">🖨️ Print / PDF</button>
    </div>
  </div>`;
  SECTIONS.forEach(s=>updScript(s.id,true));
}
function addFrame(id,t){const ta=el("ta_"+id);ta.value=(ta.value.trim()?ta.value.trim()+" ":"")+t;updScript(id);ta.focus()}
function fmt(sec){const mm=Math.floor(sec/60),ss=Math.round(sec%60);return mm+":"+String(ss).padStart(2,"0")}
function updScript(id,silent){
  const sec=SECTIONS.find(s=>s.id===id);const v=el("ta_"+id).value;S.script[id]=v;
  const w=words(v);const pct=Math.min(100,w/sec.max*100);
  const mt=el("m_"+id);mt.className="meter "+(w<sec.min?"low":w>sec.max?"high":"");mt.firstElementChild.style.width=pct+"%";
  const blanks=(v.match(/___/g)||[]).length;
  el("st_"+id).innerHTML=`${w} words · ≈ ${fmt(w/WPM*60)} · target ${sec.min}–${sec.max} words ${w<sec.min?"· <span class='warn'>add more detail</span>":w>sec.max?"· <span class='warn'>too long, cut some ideas</span>":"· <span class='okmsg'>good length ✓</span>"}${blanks?` · <span class='warn'>${blanks} blank(s) ___ to complete</span>`:""}`;
  const tot=SECTIONS.reduce((a,s)=>a+words(S.script[s.id]),0);
  el("totW").textContent=tot+" words";el("totT").textContent="≈ "+fmt(tot/WPM*60)+" minutes";
  el("totMsg").textContent=tot<330?"Under 3 minutes — add more detail.":tot>550?"Over 5 minutes — cut some ideas.":"✓ Between 3 and 5 minutes.";
}
function finishScript(){
  const missing=SECTIONS.filter(s=>words(S.script[s.id])<Math.round(s.min*0.6));
  const blanks=SECTIONS.some(s=>(S.script[s.id]||"").includes("___"));
  if(missing.length){toast("Please write more for: "+missing.map(s=>s.title.split("·")[1].trim()).join(", "));return}
  if(blanks){toast("Please complete all the ___ blanks");return}
  markDone("explain");go("extend");
}

function sentences(t){return (t||"").split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean)}
function rExtend(m){
  m.innerHTML=`
  <div class="card"><span class="phase-tag">EXTEND</span>
    <h2>Shrink your script into cue cards</h2>
    <p class="lead">You will not read the full script on camera. For each part, write only the <b>key words</b> that remind you of each idea. Maximum <b>15 words</b> per card.</p>
    <div class="card" style="background:var(--tan-l)">
      <b>Example</b><br>
      <span style="color:var(--muted)">Script:</span> “From this activity, I learned that preparing questions before an interview makes me feel more confident.”<br>
      <span style="color:var(--muted)">Cue card:</span> <b>learned → prepare questions → confident</b>
    </div>
    ${SECTIONS.map(sec=>`
      <div class="cue">
        <h4>${sec.title}</h4>
        <details><summary style="cursor:pointer;color:var(--muted)">Show my script for this part</summary><p style="margin:8px 0;color:var(--muted)">${esc(S.script[sec.id]||"(empty)")}</p></details>
        <input type="text" id="cu_${sec.id}" value="${esc(S.cues[sec.id]||"")}" oninput="updCue('${sec.id}')" placeholder="key words → key words → key words" style="margin-top:8px">
        <div class="stat" id="cs_${sec.id}"></div>
      </div>`).join("")}
    <button class="btn btn-tan" onclick="finishCues()">Check my cue cards ✓</button>
  </div>
  <div class="card ${S.done.cues?'':'hidden'}" id="glanceCard"><span class="phase-tag">EXTEND</span>
    <h2>👀 Glance-and-look-up practice</h2>
    <p class="lead">Each sentence from your script appears for a few seconds, then disappears. Look up and <b>say it to the camera</b> (or a partner) in your own way. You don't need the exact words!</p>
    <div class="row">Seconds to glance: <input type="range" min="2" max="6" value="3" id="gsec" oninput="el('gsv').textContent=this.value"> <b id="gsv">3</b></div>
    <div class="glance-stage" id="stage">Press Start</div>
    <div class="row"><button class="btn btn-green" onclick="glanceStart()">▶ Start / Next sentence</button><span class="stat" id="gprog"></span></div>
    <div class="row" style="margin-top:14px"><button class="btn btn-ghost" onclick="printCues()">🖨️ Print my cue cards</button>
    <button class="btn btn-green" onclick="if(S.glanceCount>=5){markDone('extend');go('evaluate')}else toast('Practise at least 5 sentences first')">Next: Evaluate ➜</button></div>
  </div>
  <div class="print-only" id="printArea"></div>`;
  SECTIONS.forEach(s=>updCue(s.id));
}
function updCue(id){
  const v=el("cu_"+id).value;S.cues[id]=v;const w=words(v);
  const scriptSents=sentences(S.script[id]).map(x=>x.toLowerCase().replace(/[^a-z ]/g,""));
  const copied=v.length>25&&scriptSents.some(s=>s.includes(v.toLowerCase().replace(/[^a-z ]/g,"").trim()));
  el("cs_"+id).innerHTML=!w?"":w>15?`<span class='warn'>${w} words — too many! Keep only key words.</span>`:copied?`<span class='warn'>This looks like a full sentence from your script. Use key words only.</span>`:`<span class='okmsg'>${w} words ✓</span>`;
}
function finishCues(){
  const bad=SECTIONS.filter(s=>{const w=words(S.cues[s.id]);return w<2||w>15});
  if(bad.length){toast("Check your cards: each needs 2–15 key words");return}
  if(!S.done.cues){S.done.cues=true;addPts(20,"Cue cards ready! +20");confetti()}
  el("glanceCard").classList.remove("hidden");el("glanceCard").scrollIntoView({behavior:"smooth"});
}
let gIdx=-1,gTimer=null;S.glanceCount=0;
function glanceStart(){
  const all=SECTIONS.flatMap(s=>sentences(S.script[s.id]));
  if(!all.length){toast("Write your script first");return}
  gIdx=(gIdx+1)%all.length;const st=el("stage");clearTimeout(gTimer);
  st.className="glance-stage";st.textContent=all[gIdx];
  gTimer=setTimeout(()=>{st.className="glance-stage hidden-line";st.textContent="👀 Look up and say it!"},(+el("gsec").value)*1000);
  S.glanceCount=(S.glanceCount||0)+1;el("gprog").textContent=`Sentence ${gIdx+1} of ${all.length} · practised ${S.glanceCount}`;
  if(S.glanceCount===5)addPts(10,"Great practice! +10");
}
function printCues(){
  el("printArea").innerHTML=`<h2>Cue cards – ${esc(S.name)}</h2>`+SECTIONS.map(s=>`<div style="border:2px solid #F28C28;border-radius:10px;padding:14px;margin:10px 0;page-break-inside:avoid"><b>${s.title}</b><p style="font-size:20px;margin-top:6px">${esc(S.cues[s.id]||"")}</p></div>`).join("");
  window.print();
}

function rEvaluate(m){
  const n=Object.values(S.checks).filter(Boolean).length;
  const allPhases=["engage","explore","explain","extend"].every(p=>S.done[p]);
  const pass=n>=Math.ceil(CHECKS.length*0.8)&&allPhases&&S.reflect.trim().length>15;
  m.innerHTML=`
  <div class="card"><span class="phase-tag">EVALUATE</span>
    <h2>Check your script</h2>
    <p class="lead">Be honest. Tick only what is true. You need at least ${Math.ceil(CHECKS.length*0.8)} of ${CHECKS.length} ticks for your certificate.</p>
    ${CHECKS.map((c,i)=>`<label class="check"><input type="checkbox" ${S.checks[i]?'checked':''} onchange="S.checks[${i}]=this.checked;render()"> <span>${c}</span></label>`).join("")}
    <h3 style="margin-top:14px">One thing I will practise before recording:</h3>
    <textarea style="min-height:70px" oninput="S.reflect=this.value" onblur="render()">${esc(S.reflect)}</textarea>
    <h3 style="margin-top:14px">Badges</h3>
    <div class="badges">${[["engage","🎯 Planner"],["explore","🗣️ Spoken Style"],["explain","✍️ Script Writer"],["extend","👀 Glance Master"]].map(b=>`<span class="badge ${S.done[b[0]]?'on':''}">${b[1]}</span>`).join("")}</div>
    <div class="row" style="margin-top:16px"><button class="btn btn-green" onclick="${pass?"showCert()":"toast('Finish all phases, tick at least "+Math.ceil(CHECKS.length*0.8)+" items and write your reflection')"}">🏆 Get my certificate</button>
    <button class="btn btn-tan" onclick="saveJSON()">💾 Save my work (for next lesson)</button></div>
  </div>
  <div id="certBox"></div>`;
}
function showCert(){
  if(!S.done.evaluate){S.done.evaluate=true;addPts(10);renderNav()}
  const tot=SECTIONS.reduce((a,s)=>a+words(S.script[s.id]),0);
  el("certBox").innerHTML=`<div class="cert">
    <div style="font-size:3rem">🏆</div>
    <h2>Certificate of Achievement</h2><p>This certifies that</p>
    <div class="name">${esc(S.name)}</div>
    <p>has written a ${fmt(tot/WPM*60)}-minute video script and created key-word cue cards in <b>Script Lab</b>.</p>
    <p style="margin-top:8px">Points: <b>${S.points}</b> · ${new Date().toLocaleDateString("en-GB")}</p>
    <p style="margin-top:14px;color:var(--muted);font-size:.85rem">Designed by: Nazila Motahari · LSC 1503</p>
  </div><div class="row no-print" style="margin-top:10px;justify-content:center"><button class="btn btn-ghost" onclick="window.print()">🖨️ Print certificate</button></div>`;
  confetti();el("certBox").scrollIntoView({behavior:"smooth"});
}

/* ---------------- SAVE / LOAD ---------------- */
function saveJSON(){
  const data={app:"ScriptLab",version:1,saved:new Date().toISOString(),name:S.name,points:S.points,done:S.done,script:S.script,cues:S.cues,checks:S.checks,reflect:S.reflect,sections:SECTIONS.map(s=>({id:s.id,title:s.title}))};
  const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`ScriptLab_${(S.name||"student").replace(/\s+/g,"_")}.json`;a.click();
  toast("Saved! Keep this file for Lesson 3.");
}
function loadJSON(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="ScriptLab")throw 0;
    Object.assign(S,{name:d.name||"",points:d.points||0,done:d.done||{},script:d.script||{},cues:d.cues||{},checks:d.checks||{},reflect:d.reflect||""});
    toast("Welcome back, "+S.name+"!");go(S.done.extend?"evaluate":S.done.explain?"extend":"explain")}catch(_){toast("This is not a Script Lab file")}};
  r.readAsText(f);e.target.value="";
}

/* ---------------- CONFETTI ---------------- */
function confetti(){
  const c=el("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#1F5F4A","#F28C28","#FFD9B0","#2E7D62","#fff"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,c:cols[Math.random()*cols.length|0],v:2+Math.random()*3,s:Math.random()*6}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin((f+p.s)/10);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<160)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})();
}

renderNav();render();
</script>
</body>
</html>
